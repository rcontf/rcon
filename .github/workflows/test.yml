name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: v2.x

      - run: deno task test

  e2e-tests:
    name: End-to-end tests (real game server)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      test-server:
        image: ghcr.io/tf2pickup-org/tf2-gameserver:latest
        ports:
          - 27015:27015/tcp
          - 27015:27015/udp
          - 27020:27020/udp
        env:
          SERVER_HOSTNAME: "test rcon server"
          PORT: 27015
          CLIENT_PORT: 27016
          STEAM_PORT: 27017
          STV_PORT: 27020
          RCON_PASSWORD: "password"
        options: --tty --add-host host.docker.internal:host-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: v2.x

      - name: Wait for game server port
        run: |
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 27015 && exit 0
            sleep 2
          done
          echo "game server never opened port 27015" >&2
          exit 1

      - name: Give the game server time to finish loading
        run: sleep 20

      - run: deno task e2e
